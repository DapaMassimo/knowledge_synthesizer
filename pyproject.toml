[project]
name = "knowledge-synthesizer"
version = "0.1.0"
description = "Ingest heterogeneous sources and produce grounded summaries and cited QA over a chosen topic."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
dependencies = [
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
]

[dependency-groups]
dev = [
    "ruff>=0.6.0",
    "mypy>=1.11.0",
    "pytest>=8.2",
    "pytest-cov>=5.0",
    "pytest-asyncio>=0.24.0",
    "import-linter>=2.0",
    "pre-commit>=3.7",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/knowledge_synthesizer"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "SIM", "RUF"]

[tool.ruff.lint.isort]
known-first-party = ["knowledge_synthesizer", "tests"]

[tool.mypy]
python_version = "3.12"
strict = true
disallow_untyped_defs = true
disallow_any_generics = true
no_implicit_reexport = true
warn_unused_ignores = true
warn_redundant_casts = true
files = ["src"]
mypy_path = "src"
explicit_package_bases = true
namespace_packages = true
plugins = ["pydantic.mypy"]

[tool.pydantic-mypy]
init_forbid_extra = true
init_typed = true
warn_required_dynamic_aliases = true

[tool.pytest.ini_options]
minversion = "8.0"
addopts = "-ra -m 'not eval'"
testpaths = ["tests"]
asyncio_mode = "auto"
markers = [
    "unit: fast tests using only fakes",
    "integration: tests against real ephemeral infra (e.g. Chroma)",
    "eval: ragas evaluation, opt-in, excluded from the default run",
]

[tool.coverage.run]
branch = true
source = ["knowledge_synthesizer"]

[tool.coverage.report]
show_missing = true
exclude_also = [
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
    "\\.\\.\\.",
    "@(typing\\.)?overload",
]
